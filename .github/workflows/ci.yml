# =============================================================================
# BHD-STOR — Continuous Integration
# Blocking: Backend build, Frontend build+typecheck, Backend tsc error budget,
#           Backend security unit tests (with Postgres/Redis services).
# Informational: full unit suite, Playwright smoke, npm audit, ESLint.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build-backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: ./backend
        run: npm ci
      - name: Build (SWC)
        working-directory: ./backend
        run: npm run build
      - name: TypeScript error budget (blocking)
        working-directory: ./backend
        run: npm run typecheck:gate
      - name: ESLint (non-interactive)
        working-directory: ./backend
        env:
          CI: "true"
        run: npm run lint
        continue-on-error: true

  backend-security:
    name: Backend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhd
          POSTGRES_PASSWORD: bhd
          POSTGRES_DB: bhd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhd -d bhd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      CI: "true"
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: bhd
      DATABASE_PASSWORD: bhd
      DATABASE_NAME: bhd_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: ./backend
        run: npm ci
      - name: Security unit tests (blocking)
        working-directory: ./backend
        run: npm run test:security

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

  typecheck-frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: tsc
        working-directory: ./frontend
        run: npx tsc --noEmit

  unit-tests:
    name: Unit tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install
        working-directory: ./${{ matrix.service }}
        run: npm ci
      - name: Test
        working-directory: ./${{ matrix.service }}
        run: npm test -- --passWithNoTests --coverage=false
        continue-on-error: true

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps
      - name: Smoke tests (blocking)
        working-directory: ./frontend
        env:
          CI: "true"
          PLAYWRIGHT_SMOKE_ONLY: "true"
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: npm run test:e2e:smoke

  security-audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true
